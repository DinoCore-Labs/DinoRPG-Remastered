name: Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
      - develop

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - name: Add pnpm to PATH
        run: echo "$HOME/.local/share/pnpm" >> $GITHUB_PATH

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run unit tests
        run: pnpm test:unit

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dinorpg_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d dinorpg_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test

      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dinorpg_test?schema=public

      API_URL: http://127.0.0.1:8081
      SELF_URL: http://127.0.0.1:8080

      DINORPG_SECRET_KEY_JWT: test_jwt_secret_for_integration_tests
      DINORPG_SECRET_KEY_COOKIE: test_cookie_secret_for_integration_tests

      SALT: test_salt

      DEVICE_COOKIE: dz_device
      DEVICE_TOKEN_SECRET: test_device_token_secret_for_integration
      IP_TOKEN_SECRET: test_ip_token_secret_for_integration

      MAX_ACCOUNTS_PER_DEVICE_PER_MONTH: 100
      MAX_ACCOUNTS_PER_IP_PER_MONTH: 100
      SIGNUP_COUNTER_GRACE_DAYS: 1

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - name: Add pnpm to PATH
        run: echo "$HOME/.local/share/pnpm" >> $GITHUB_PATH

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run integration tests
        run: pnpm --filter @dinorpg/server test:integration:ci

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - name: Add pnpm to PATH
        run: echo "$HOME/.local/share/pnpm" >> $GITHUB_PATH

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e
